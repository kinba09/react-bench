name: Browser behavior
on: [push, pull_request]
permissions:
  contents: read
jobs:
  visual-reaction:
    # Keep the runner aligned with Playwright 1.60's supported Linux platforms.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
